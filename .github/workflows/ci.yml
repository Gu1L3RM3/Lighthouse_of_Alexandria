name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (syntax errors and undefined names only)
        run: ruff check .

      - name: Run unit tests
        run: python -m unittest discover -s code/tests -v

      - name: Boot every scene headless
        run: python scripts/smoke_scenes.py --out "$RUNNER_TEMP/smoke"

      - name: Test the harness
        run: python -m pytest -q scripts/tests

      - name: Keep screenshots of a failed boot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scene-screenshots
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 7

  # Not a required check yet: the pygbag runtime comes from its CDN.
  web-smoke:
    name: web smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect web changes
        id: web
        env:
          HARNESS_BASE: HEAD^1
        run: |
          if scripts/verify.sh web-needed; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.web.outputs.needed == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-e2e.txt

      - name: Install browser check dependencies
        if: steps.web.outputs.needed == 'true'
        run: |
          pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Build and play the web version
        if: steps.web.outputs.needed == 'true'
        run: python scripts/web_smoke.py --out "$RUNNER_TEMP/web"

      - name: Keep the browser screenshots
        if: always() && steps.web.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: ${{ runner.temp }}/web
          if-no-files-found: ignore
          retention-days: 7
